apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ddclient-config
spec:
  refreshInterval: 1h
  secretStoreRef:
    # This name must match the metadata.name in the `SecretStore`
    name: bitwarden-personal-cloud
    kind: ClusterSecretStore
  target:
    name: ddclient-config
    template:
      engineVersion: v2
      data:
        # Reuses the same Hetzner DNS API token as the cert-manager
        # hetzner-cloud-webhook (see
        # turing-talos/apps/hetzner-cloud-webhook/externalsecret.yaml), since
        # it already has permission to manage records in the jern.fi zone.
        #
        # jern.fi is an apex domain, so the Hetzner API record name for it is
        # "@". ddclient handles that automatically when hostname == zone.
        # Add more host stanzas below (e.g. for `*.jern.fi`) if other DNS
        # records also need to track the dynamic IP.
        ddclient.conf: |
          protocol=hetzner                          \
          zone=jern.fi                              \
          password='{{ .token }}'                   \
          jern.fi
  data:
  - secretKey: token
    remoteRef:
      key: c054fbca-6e33-4bb4-a4cd-b3f2009a9271

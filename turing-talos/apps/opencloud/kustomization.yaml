apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: opencloud
labels:
- pairs:
    environment: turing-talos
resources:
- ../../../opencloud/base
- namespace.yaml
- httproute.yaml
- opencloud-pv.yaml
- external-secret.yaml

patches:
- path: opencloud-data-pvc.yaml
- path: deployment-patch.yaml

# Keep the name hash on these ConfigMaps: the OpenCloud pod only reads them at
# startup, so a changed hash is what makes the Deployment roll out new settings.
configMapGenerator:
- name: opencloud-env
  envs:
  - config.env
  - oidc.env
- name: opencloud-csp
  files:
  - csp.yaml

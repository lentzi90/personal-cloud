apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: home-assistant
labels:
- pairs:
    environment: turing-talos
resources:
- ../../../home-assistant/base
- namespace.yaml
- httproute.yaml
- externalsecret.yaml

components:
- ../../../home-assistant/components/keycloak-sso
- ../../../home-assistant/components/custom-integrations

configMapGenerator:
# Custom integrations to install, see components/custom-integrations.
- name: home-assistant-integrations-enabled
  literals:
  - enabled=auth_oidc goecharger_api2 solarman vag_connect
- name: home-assistant-oidc-config
  files:
  - auth_oidc.yaml

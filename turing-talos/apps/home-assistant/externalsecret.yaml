apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    # This name must match the metadata.name in the `ClusterSecretStore`
    name: bitwarden-personal-cloud
    kind: ClusterSecretStore
  data:
  # The full content of Home Assistant's secrets.yaml, referenced with !secret
  # in configuration.yaml. Currently: latitude, longitude and elevation.
  - secretKey: secrets.yaml
    remoteRef:
      key: bbe17a21-7775-4761-a096-b4f4013c771c

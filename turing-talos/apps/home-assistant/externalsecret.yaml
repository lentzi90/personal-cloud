apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    # This name must match the metadata.name in the `ClusterSecretStore`
    name: bitwarden-personal-cloud
    kind: ClusterSecretStore
  target:
    name: home-assistant-secrets
    template:
      engineVersion: v2
      data:
        # Rendered into Home Assistant's secrets.yaml, referenced with !secret
        # in configuration.yaml.
        secrets.yaml: |
          latitude: {{ .latitude }}
          longitude: {{ .longitude }}
          elevation: {{ .elevation }}
  data:
  # TODO: replace the placeholder keys with the Bitwarden secret IDs.
  - secretKey: latitude
    remoteRef:
      key: 00000000-0000-0000-0000-000000000001
  - secretKey: longitude
    remoteRef:
      key: 00000000-0000-0000-0000-000000000002
  - secretKey: elevation
    remoteRef:
      key: 00000000-0000-0000-0000-000000000003

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui
spec:
  refreshInterval: 1h
  secretStoreRef:
    # This name must match the metadata.name in the `ClusterSecretStore`
    name: bitwarden-personal-cloud
    kind: ClusterSecretStore
  data:
  # Random string, signs Open WebUI sessions.
  - secretKey: secret-key
    remoteRef:
      key: cb346141-d3a8-4e16-a816-b4ee0141ba9a
  # Client secret of the `agent` client in the Keycloak jern.fi realm.
  - secretKey: oauth-client-secret
    remoteRef:
      key: bac1f8b1-1bfa-462b-a493-b4ee01426a58
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-terminal
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-personal-cloud
    kind: ClusterSecretStore
  data:
  # Random string, shared between Open WebUI and Open Terminal.
  - secretKey: api-key
    remoteRef:
      key: e1050e7b-7880-42f5-a317-b4ee0142a686
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-personal-cloud
    kind: ClusterSecretStore
  data:
  # OpenAI compatible endpoint, e.g. https://api.openai.com/v1
  - secretKey: base-url
    remoteRef:
      key: bf0d8e36-d297-4637-b647-b4ee0143a366
  - secretKey: api-key
    remoteRef:
      key: 94d9c431-6d8c-4f16-895e-b4ee01441e5b

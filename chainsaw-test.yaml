apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: kind-deploy
spec:
  steps:
  - try:
    # Edit all apps to use the target revision instead of HEAD
    - script:
        timeout: 10s
        content: |
          sed -i "s HEAD ${TARGET_REVISION} g" apps/kind/*-app.yaml
  - try:
    # Apply cert-manager manifests
    - script:
        timeout: 1m
        content: kubectl apply -k cert-manager/overlays/kind
    - assert:
        timeout: 2m
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: cert-manager-webhook
            namespace: cert-manager
          status:
            (conditions[?type == 'Available']):
            - status: 'True'
  - try:
    # Install Gateway API CRDs (needed before argocd, which includes an HTTPRoute)
    - script:
        timeout: 1m
        content: kubectl apply --server-side -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.4.1/standard-install.yaml
  - try:
    # Apply argocd manifests
    - script:
        timeout: 1m
        content: kubectl apply --server-side -k argocd/overlays/kind
    # Verify that the argocd-server deployment is ready
    - assert:
        timeout: 5m
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: argocd-server
            namespace: argocd
          status:
            # filter conditions array to keep elements where `type == 'Available'`
            # and assert there's a single element matching the filter
            # and that this element status is `True`
            (conditions[?type == 'Available']):
            - status: 'True'
    - assert:
        timeout: 5m
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: argocd-repo-server
            namespace: argocd
          status:
            (conditions[?type == 'Available']):
            - status: 'True'
    - assert:
        timeout: 5m
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: argocd-redis
            namespace: argocd
          status:
            (conditions[?type == 'Available']):
            - status: 'True'
    - assert:
        timeout: 5m
        resource:
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: argocd-application-controller
            namespace: argocd
          status:
            (readyReplicas == replicas): true
    catch:
    - script:
        timeout: 1m
        content: |
          kubectl -n argocd get pods,deploy,sts,svc,endpoints,networkpolicy -o wide
          kubectl -n argocd describe deploy argocd-redis
          kubectl -n argocd describe pod -l app.kubernetes.io/name=argocd-redis
          kubectl -n argocd get events --sort-by=.lastTimestamp
          kubectl -n kube-system get pods -o wide
    - podLogs:
        namespace: argocd
        selector: app.kubernetes.io/name=argocd-redis
        container: secret-init
        tail: 100
    - podLogs:
        namespace: argocd
        selector: app.kubernetes.io/name=argocd-redis
        container: redis
        tail: 100
    - podLogs:
        namespace: kube-system
        selector: app=kindnet
        tail: 100
  # cert-manager
  - try:
    - script:
        timeout: 10s
        content: kubectl -n argocd apply -f apps/kind/cert-manager-app.yaml
    - assert:
        timeout: 10m
        resource:
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: cert-manager
            namespace: argocd
          status:
            health:
              status: Healthy
            sync:
              status: Synced
    catch:
    - describe:
        apiVersion: argoproj.io/v1alpha1
        kind: Application
        name: cert-manager
        namespace: argocd
    - describe:
        apiVersion: v1
        kind: Pod
        namespace: cert-manager
        selector: app.kubernetes.io/instance=cert-manager
    - podLogs:
        namespace: cert-manager
        selector: app.kubernetes.io/instance=cert-manager
    - podLogs:
        namespace: argocd
        selector: app.kubernetes.io/name=argocd-repo-server
        tail: 200
  # metallb
  - try:
    - script:
        timeout: 10s
        content: kubectl -n argocd apply -f apps/kind/metallb-app.yaml
    - assert:
        timeout: 10m
        resource:
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: metallb
            namespace: argocd
          status:
            health:
              status: Healthy
            sync:
              status: Synced
    catch:
    - describe:
        apiVersion: argoproj.io/v1alpha1
        kind: Application
        name: metallb
        namespace: argocd
    - describe:
        apiVersion: v1
        kind: Pod
        name: controller
        namespace: metallb
    - describe:
        apiVersion: v1
        kind: Pod
        name: speaker
        namespace: metallb-system
    - podLogs:
        name: controller
        namespace: metallb-system
    - podLogs:
        name: speaker
        namespace: metallb-system
  # envoy-gateway
  - try:
    - script:
        timeout: 10s
        content: kubectl -n argocd apply -f apps/kind/envoy-gateway-app.yaml
    - assert:
        timeout: 10m
        resource:
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: envoy-gateway
            namespace: argocd
          status:
            health:
              status: Healthy
            sync:
              status: Synced
    catch:
    - describe:
        apiVersion: argoproj.io/v1alpha1
        kind: Application
        name: envoy-gateway
        namespace: argocd
    - describe:
        apiVersion: v1
        kind: Pod
        name: envoy-gateway
        namespace: envoy-gateway-system
    - podLogs:
        name: envoy-gateway
        namespace: envoy-gateway-system
  # envoy-gateways (GatewayClass and Gateway resources)
  - try:
    - script:
        timeout: 10s
        content: kubectl -n argocd apply -f apps/kind/envoy-gateways-app.yaml
    - assert:
        timeout: 10m
        resource:
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: envoy-gateways
            namespace: argocd
          status:
            health:
              status: Healthy
            sync:
              status: Synced
    catch:
    - describe:
        apiVersion: argoproj.io/v1alpha1
        kind: Application
        name: envoy-gateways
        namespace: argocd
    - describe:
        apiVersion: gateway.networking.k8s.io/v1
        kind: GatewayClass
        name: envoy
    - describe:
        apiVersion: gateway.networking.k8s.io/v1
        kind: Gateway
        name: envoy-private
        namespace: envoy-gateway-system
    - describe:
        apiVersion: gateway.networking.k8s.io/v1
        kind: Gateway
        name: envoy-public
        namespace: envoy-gateway-system
  # Resolve the private gateway address so that in-cluster requests can
  # reach the hostname based routes. This is deliberately not written to the
  # test runner's /etc/hosts: the MetalLB pool it comes from is only reachable
  # from inside the cluster network, not from the runner host, so the
  # verification steps below run their curl checks from an in-cluster pod
  # instead and pass this address in via curl's --resolve.
  - try:
    - script:
        timeout: 5m
        content: |
          for _ in $(seq 60); do
            GATEWAY_IP=$(kubectl -n envoy-gateway-system get gateway envoy-private -o jsonpath='{.status.addresses[0].value}')
            if [ -n "${GATEWAY_IP}" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "${GATEWAY_IP}" ]; then
            echo "envoy-private gateway has no address"
            exit 1
          fi
          echo "${GATEWAY_IP}" > /tmp/envoy-private-ip
    catch:
    - describe:
        apiVersion: gateway.networking.k8s.io/v1
        kind: Gateway
        name: envoy-private
        namespace: envoy-gateway-system
  # argocd - Note: won't be ready until the gateway has an external IP
  - try:
    - script:
        timeout: 10s
        content: kubectl -n argocd apply --server-side -f apps/kind/argocd-app.yaml
    - assert:
        timeout: 10m
        resource:
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: argocd
            namespace: argocd
          status:
            health:
              status: Healthy
            sync:
              status: Synced
    catch:
    - describe:
        apiVersion: argoproj.io/v1alpha1
        kind: Application
        name: argocd
        namespace: argocd
    - describe:
        apiVersion: v1
        kind: Pod
        name: argocd
        namespace: argocd
    - podLogs:
        name: argocd
        namespace: argocd
  # external-secrets
  - try:
    - script:
        timeout: 10s
        content: kubectl -n argocd apply -f apps/kind/external-secrets-app.yaml
    - assert:
        timeout: 10m
        resource:
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: external-secrets
            namespace: argocd
          status:
            health:
              status: Healthy
            sync:
              status: Synced
    catch:
    - describe:
        apiVersion: argoproj.io/v1alpha1
        kind: Application
        name: external-secrets
        namespace: argocd
    - describe:
        apiVersion: v1
        kind: Pod
        name: external-secrets
        namespace: external-secrets
    - podLogs:
        namespace: external-secrets
  - try:
    # Create secret store and token secret
    - script:
        timeout: 10s
        content: |
          kubectl -n external-secrets create secret generic bitwarden-access-token-test --from-literal=token=${BITWARDEN_ACCESS_TOKEN}
          kubectl apply -f secret-store/test-secretstore.yaml
    - assert:
        timeout: 10s
        resource:
          apiVersion: external-secrets.io/v1
          kind: ClusterSecretStore
          metadata:
            name: bitwarden-test
          status:
            # filter conditions array to keep elements where `type == 'Ready'`
            # and assert there's a single element matching the filter
            # and that this element status is `True`
            (conditions[?type == 'Ready']):
            - status: 'True'
  # Cloudnatice-pg
  - try:
    - script:
        timeout: 10s
        content: kubectl -n argocd apply -f apps/kind/cloudnative-pg-app.yaml
    - assert:
        timeout: 10m
        resource:
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: cloudnative-pg
            namespace: argocd
          status:
            health:
              status: Healthy
            sync:
              status: Synced
    catch:
    - describe:
        apiVersion: argoproj.io/v1alpha1
        kind: Application
        name: cloudnative-pg
        namespace: argocd
    - describe:
        apiVersion: v1
        kind: Pod
        name: cnpg
        namespace: cnpg-system
    - podLogs:
        name: cnpg
        namespace: cnpg-system
  # hetzner-cloud-webhook
  - try:
    - script:
        timeout: 10s
        content: kubectl -n argocd apply -f apps/kind/hetzner-cloud-webhook-app.yaml
    - assert:
        timeout: 10m
        resource:
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: hetzner-cloud-webhook
            namespace: argocd
          status:
            health:
              status: Healthy
            sync:
              status: Synced
    catch:
    - describe:
        apiVersion: argoproj.io/v1alpha1
        kind: Application
        name: hetzner-cloud-webhook
        namespace: argocd
    - describe:
        apiVersion: v1
        kind: Pod
        name: cert-manager-webhook-hetzner-cloud
        namespace: cert-manager
    - podLogs:
        name: cert-manager-webhook-hetzner-cloud
        namespace: cert-manager
  # keycloak-operator
  - try:
    - script:
        timeout: 10s
        content: kubectl -n argocd apply -f apps/kind/keycloak-operator-app.yaml
    - assert:
        timeout: 10m
        resource:
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: keycloak-operator
            namespace: argocd
          status:
            health:
              status: Healthy
            sync:
              status: Synced
    catch:
    - describe:
        apiVersion: argoproj.io/v1alpha1
        kind: Application
        name: keycloak-operator
        namespace: argocd
    - describe:
        apiVersion: v1
        kind: Pod
        name: keycloak-operator
        namespace: keycloak
    - podLogs:
        name: keycloak-operator
        namespace: keycloak
  # keycloak
  - try:
    - script:
        timeout: 10s
        content: kubectl -n argocd apply -f apps/kind/keycloak-app.yaml
    - assert:
        timeout: 10m
        resource:
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: keycloak
            namespace: argocd
          status:
            health:
              status: Healthy
            sync:
              status: Synced
    catch:
    - describe:
        apiVersion: argoproj.io/v1alpha1
        kind: Application
        name: keycloak
        namespace: argocd
    - describe:
        apiVersion: k8s.keycloak.org/v2alpha1
        kind: Keycloak
        name: keycloak
        namespace: keycloak
    - describe:
        apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        name: keycloak-db
        namespace: keycloak
    - podLogs:
        name: keycloak-0
        namespace: keycloak
    - podLogs:
        name: keycloak-db-1
        namespace: keycloak
  # Verify KeycloakRealmImport for the shared homelab realm
  - try:
    - assert:
        timeout: 10m
        resource:
          apiVersion: k8s.keycloak.org/v2alpha1
          kind: KeycloakRealmImport
          metadata:
            name: homelab-realm
            namespace: keycloak
          status:
            (conditions[?type == 'Done']):
            - status: 'True'
    catch:
    - describe:
        apiVersion: k8s.keycloak.org/v2alpha1
        kind: KeycloakRealmImport
        name: homelab-realm
        namespace: keycloak
    - script:
        timeout: 30s
        content: |
          echo "=== Keycloak Realm Import Status ==="
          kubectl get keycloakrealmimport -n keycloak -o yaml
          echo "=== Keycloak Realm Import Job ==="
          kubectl get jobs -n keycloak -o wide
          echo "=== Keycloak Realm Import Job Pod(s) ==="
          kubectl get pods -n keycloak -l app=keycloak-realm-import -o wide
          echo "=== Keycloak Realm Import Job Logs ==="
          # The realm-import Job's pod is labeled app=keycloak-realm-import by the
          # operator (distinct from the main Keycloak StatefulSet pod, which is
          # labeled app=keycloak and never runs the actual import) - this is where
          # the real Keycloak-reported validation error/stack trace shows up.
          kubectl logs -n keycloak -l app=keycloak-realm-import --tail=200 --all-containers
          echo "=== Keycloak Logs ==="
          kubectl logs -n keycloak -l app=keycloak --tail=100
  # pi-hole
  - try:
    - script:
        timeout: 10s
        content: kubectl -n argocd apply -f apps/kind/pi-hole-app.yaml
    - assert:
        timeout: 10m
        resource:
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: pi-hole
            namespace: argocd
          status:
            health:
              status: Healthy
            sync:
              status: Synced
    catch:
    - describe:
        apiVersion: argoproj.io/v1alpha1
        kind: Application
        name: pi-hole
        namespace: argocd
    - describe:
        apiVersion: v1
        kind: Pod
        name: pi-hole
        namespace: pi-hole
    - podLogs:
        name: pi-hole
        namespace: pi-hole
  # ddclient
  - try:
    - script:
        timeout: 10s
        content: kubectl -n argocd apply -f apps/kind/ddclient-app.yaml
    - assert:
        timeout: 10m
        resource:
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: ddclient
            namespace: argocd
          status:
            health:
              status: Healthy
            sync:
              status: Synced
    catch:
    - describe:
        apiVersion: argoproj.io/v1alpha1
        kind: Application
        name: ddclient
        namespace: argocd
    - describe:
        apiVersion: batch/v1
        kind: CronJob
        name: ddclient
        namespace: ddclient
    - podLogs:
        namespace: ddclient
        selector: app.kubernetes.io/name=ddclient
  # wireguard
  - try:
    - script:
        timeout: 10s
        content: kubectl -n argocd apply -f apps/kind/wireguard-app.yaml
    - assert:
        timeout: 10m
        resource:
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: wireguard
            namespace: argocd
          status:
            health:
              status: Healthy
            sync:
              status: Synced
    catch:
    - describe:
        apiVersion: argoproj.io/v1alpha1
        kind: Application
        name: wireguard
        namespace: argocd
    - describe:
        apiVersion: v1
        kind: Pod
        name: wireguard
        namespace: wireguard
    - podLogs:
        name: wireguard
        namespace: wireguard
  # jellyfin
  - try:
    - script:
        timeout: 10s
        content: kubectl -n argocd apply -f apps/kind/jellyfin-app.yaml
    - assert:
        timeout: 10m
        resource:
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: jellyfin
            namespace: argocd
          status:
            health:
              status: Healthy
            sync:
              status: Synced
    catch:
    - describe:
        apiVersion: argoproj.io/v1alpha1
        kind: Application
        name: jellyfin
        namespace: argocd
    - describe:
        apiVersion: v1
        kind: Pod
        name: jellyfin
        namespace: jellyfin
    - podLogs:
        name: jellyfin
        namespace: jellyfin
  # Verify Jellyfin SSO plugin configuration
  - try:
    - script:
        timeout: 30s
        content: |
          echo "=== Verifying Jellyfin SSO Plugin ConfigMap ==="
          kubectl get configmap jellyfin-sso-config -n jellyfin -o jsonpath='{.data.SSO-Auth\.xml}' | grep -q 'OidEndpoint' && echo "SSO-Auth.xml present and contains OidEndpoint"
          echo ""
          echo "=== Verifying SSO plugin DLL was installed by the init container ==="
          POD=$(kubectl get pod -n jellyfin -l app.kubernetes.io/name=jellyfin -o jsonpath='{.items[0].metadata.name}')
          kubectl exec -n jellyfin "${POD}" -c jellyfin -- find /config/plugins -iname 'SSO-Auth.dll'
    catch:
    - script:
        timeout: 30s
        content: |
          echo "=== Jellyfin SSO ConfigMap ==="
          kubectl get configmap jellyfin-sso-config -n jellyfin -o yaml
          echo "=== Jellyfin Deployment ==="
          kubectl get deployment jellyfin -n jellyfin -o yaml
          echo "=== Jellyfin install-sso-plugin init container logs ==="
          kubectl logs -n jellyfin -l app.kubernetes.io/name=jellyfin -c install-sso-plugin --tail=100
  # opencloud
  - try:
    - script:
        timeout: 10s
        content: kubectl -n argocd apply -f apps/kind/opencloud-app.yaml
    - assert:
        timeout: 10m
        resource:
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: opencloud
            namespace: argocd
          status:
            health:
              status: Healthy
            sync:
              status: Synced
    catch:
    - describe:
        apiVersion: argoproj.io/v1alpha1
        kind: Application
        name: opencloud
        namespace: argocd
    - describe:
        apiVersion: v1
        kind: Pod
        name: opencloud
        namespace: opencloud
    - podLogs:
        name: opencloud
        namespace: opencloud
  # Verify OpenCloud OIDC configuration
  - try:
    - script:
        timeout: 30s
        content: |
          echo "=== Verifying OpenCloud OIDC Configuration ==="
          # The ConfigMap name carries a content hash, look it up via the deployment
          CM=$(kubectl get deployment opencloud -n opencloud -o jsonpath='{.spec.template.spec.containers[0].envFrom[0].configMapRef.name}')
          # Check that the ConfigMap has OIDC settings
          kubectl get configmap "${CM}" -n opencloud -o jsonpath='{.data.OC_OIDC_ISSUER}'
          echo ""
          kubectl get configmap "${CM}" -n opencloud -o jsonpath='{.data.PROXY_AUTOPROVISION_ACCOUNTS}'
          echo ""
          # Verify the deployment is using the ConfigMap
          kubectl get deployment opencloud -n opencloud -o jsonpath='{.spec.template.spec.containers[0].envFrom[*].configMapRef.name}'
          echo ""
    catch:
    - script:
        timeout: 30s
        content: |
          echo "=== OpenCloud ConfigMaps ==="
          kubectl get configmap -n opencloud -o yaml
          echo "=== OpenCloud Deployment ==="
          kubectl get deployment opencloud -n opencloud -o yaml
  # Verify Keycloak OIDC discovery endpoint is accessible
  - try:
    - script:
        timeout: 60s
        content: |
          echo "=== Testing Keycloak OIDC Discovery Endpoint ==="
          GATEWAY_IP=$(cat /tmp/envoy-private-ip)
          POD=oidc-discovery-check-$$
          # kubectl run --rm -i mixes its own client-side chatter (e.g. the
          # "pod deleted" message) into the attached stdout stream, which
          # corrupts the captured response. Create the pod, wait for it to
          # finish, then read its output back with `kubectl logs` instead,
          # which returns exactly the container's stdout.
          kubectl run "${POD}" --restart=Never --image=curlimages/curl:8.11.1 --command -- \
            curl -sk --max-time 10 --resolve "keycloak.test.local:443:${GATEWAY_IP}" https://keycloak.test.local/realms/homelab/.well-known/openid-configuration
          kubectl wait --for=jsonpath='{.status.phase}'=Succeeded "pod/${POD}" --timeout=30s
          RESPONSE=$(kubectl logs "${POD}")
          kubectl delete pod "${POD}" --ignore-not-found
          echo "$RESPONSE" | jq -e '.issuer == "https://keycloak.test.local/realms/homelab"' || exit 1
          echo "$RESPONSE" | jq -e '.authorization_endpoint' || exit 1
          echo "$RESPONSE" | jq -e '.token_endpoint' || exit 1
          echo "OIDC discovery endpoint OK"
    catch:
    - describe:
        apiVersion: v1
        kind: Pod
        namespace: keycloak
        selector: app=keycloak
    - podLogs:
        namespace: keycloak
        selector: app=keycloak
        tail: 50
  # Verify OpenCloud requires OIDC authentication
  - try:
    - script:
        timeout: 90s
        content: |
          echo "=== Testing OpenCloud OIDC Authentication Requirement ==="
          GATEWAY_IP=$(cat /tmp/envoy-private-ip)

          # WebDAV endpoint requires authentication. As above, create the pod,
          # wait for it, and read its output back with `kubectl logs` instead
          # of attaching, to avoid kubectl's own chatter corrupting the output.
          POD_CODE=opencloud-auth-check-$$
          kubectl run "${POD_CODE}" --restart=Never --image=curlimages/curl:8.11.1 --command -- \
            curl -sk --max-time 10 -o /dev/null -w "%{http_code}" --resolve "opencloud.test.local:443:${GATEWAY_IP}" https://opencloud.test.local/remote.php/webdav/
          kubectl wait --for=jsonpath='{.status.phase}'=Succeeded "pod/${POD_CODE}" --timeout=30s
          HTTP_CODE=$(kubectl logs "${POD_CODE}")
          kubectl delete pod "${POD_CODE}" --ignore-not-found
          echo "HTTP Code: $HTTP_CODE"
          if [[ "$HTTP_CODE" != "401" ]]; then
            echo "Expected 401 Unauthorized, got $HTTP_CODE"
            exit 1
          fi

          # Verify WWW-Authenticate header references Bearer auth
          POD_HEADER=opencloud-auth-header-check-$$
          kubectl run "${POD_HEADER}" --restart=Never --image=curlimages/curl:8.11.1 --command -- \
            curl -sk --max-time 10 -I --resolve "opencloud.test.local:443:${GATEWAY_IP}" https://opencloud.test.local/remote.php/webdav/
          kubectl wait --for=jsonpath='{.status.phase}'=Succeeded "pod/${POD_HEADER}" --timeout=30s
          AUTH_HEADER=$(kubectl logs "${POD_HEADER}" | grep -i www-authenticate | head -1)
          kubectl delete pod "${POD_HEADER}" --ignore-not-found
          echo "Auth header: $AUTH_HEADER"
          if [[ "$AUTH_HEADER" != *"Bearer"* ]]; then
            echo "Expected Bearer authentication"
            exit 1
          fi
          echo "OpenCloud correctly requires OIDC authentication"
    catch:
    - describe:
        apiVersion: v1
        kind: Pod
        namespace: opencloud
        selector: app.kubernetes.io/name=opencloud
    - podLogs:
        namespace: opencloud
        selector: app.kubernetes.io/name=opencloud
        tail: 50
  # agent (Open WebUI + Open Terminal)
  - try:
    - script:
        timeout: 10s
        content: kubectl -n argocd apply -f apps/kind/agent-app.yaml
    - assert:
        timeout: 15m
        resource:
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: agent
            namespace: argocd
          status:
            health:
              status: Healthy
            sync:
              status: Synced
    catch:
    - describe:
        apiVersion: argoproj.io/v1alpha1
        kind: Application
        name: agent
        namespace: argocd
    - describe:
        apiVersion: v1
        kind: Pod
        namespace: agent
    - podLogs:
        namespace: agent
        selector: app.kubernetes.io/part-of=agent
        tail: 50
  # Verify Open WebUI is reachable through the gateway
  - try:
    - script:
        timeout: 2m
        content: |
          echo "=== Testing Open WebUI through the gateway ==="
          GATEWAY_IP=$(cat /tmp/envoy-private-ip)
          POD=agent-health-check-$$
          # The route may need a moment to be programmed, so retry inside the pod.
          kubectl run "${POD}" --restart=Never --image=curlimages/curl:8.11.1 --env="GATEWAY_IP=${GATEWAY_IP}" --command -- sh -c '
            for i in $(seq 20); do
              code=$(curl -sk --max-time 10 -o /dev/null -w "%{http_code}" --resolve "agent.test.local:443:${GATEWAY_IP}" https://agent.test.local/health)
              [ "${code}" = "200" ] && break
              sleep 3
            done
            echo "${code}"'
          kubectl wait --for=jsonpath='{.status.phase}'=Succeeded "pod/${POD}" --timeout=90s
          HTTP_CODE=$(kubectl logs "${POD}")
          kubectl delete pod "${POD}" --ignore-not-found
          echo "HTTP Code: ${HTTP_CODE}"
          if [[ "${HTTP_CODE}" != "200" ]]; then
            echo "Expected 200 from /health, got ${HTTP_CODE}"
            exit 1
          fi
          echo "Open WebUI reachable through the gateway"
    catch:
    - describe:
        apiVersion: v1
        kind: Pod
        namespace: agent
        selector: app.kubernetes.io/name=open-webui
    - podLogs:
        namespace: agent
        selector: app.kubernetes.io/name=open-webui
        tail: 50
  # collabora
  - try:
    - script:
        timeout: 10s
        content: kubectl -n argocd apply -f apps/kind/collabora-app.yaml
    - assert:
        timeout: 10m
        resource:
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: collabora
            namespace: argocd
          status:
            health:
              status: Healthy
            sync:
              status: Synced
    catch:
    - describe:
        apiVersion: argoproj.io/v1alpha1
        kind: Application
        name: collabora
        namespace: argocd
    - describe:
        apiVersion: v1
        kind: Pod
        namespace: collabora
        selector: app.kubernetes.io/name=collabora
    - podLogs:
        namespace: collabora
        selector: app.kubernetes.io/name=collabora
        tail: 100
  # home-assistant
  - try:
    - script:
        timeout: 10s
        content: kubectl -n argocd apply -f apps/kind/home-assistant-app.yaml
    - assert:
        timeout: 10m
        resource:
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: home-assistant
            namespace: argocd
          status:
            health:
              status: Healthy
            sync:
              status: Synced
    - script:
        timeout: 60s
        content: |
          echo "=== Testing Home Assistant through the gateway ==="
          GATEWAY_IP=$(cat /tmp/envoy-private-ip)
          POD=home-assistant-check-$$
          kubectl run "${POD}" --restart=Never --image=curlimages/curl:8.11.1 --command -- \
            curl -sk --max-time 10 --resolve "home-assistant.test.local:443:${GATEWAY_IP}" https://home-assistant.test.local/manifest.json
          kubectl wait --for=jsonpath='{.status.phase}'=Succeeded "pod/${POD}" --timeout=30s
          RESPONSE=$(kubectl logs "${POD}")
          kubectl delete pod "${POD}" --ignore-not-found
          echo "${RESPONSE}" | grep -q 'Home Assistant'
    # Verify the Keycloak SSO integration is installed and configured
    - script:
        timeout: 60s
        content: |
          echo "=== Verifying Home Assistant OIDC integration ==="
          POD=$(kubectl get pod -n home-assistant -l app.kubernetes.io/name=home-assistant -o jsonpath='{.items[0].metadata.name}')
          kubectl exec -n home-assistant "${POD}" -c home-assistant -- test -f /config/custom_components/auth_oidc/manifest.json
          kubectl exec -n home-assistant "${POD}" -c home-assistant -- grep -q 'discovery_url' /config/packages/auth_oidc.yaml
    catch:
    - describe:
        apiVersion: argoproj.io/v1alpha1
        kind: Application
        name: home-assistant
        namespace: argocd
    - describe:
        apiVersion: v1
        kind: Pod
        namespace: home-assistant
        selector: app.kubernetes.io/name=home-assistant
    - podLogs:
        namespace: home-assistant
        selector: app.kubernetes.io/name=home-assistant
        container: install-oidc-auth
        tail: 100
    - podLogs:
        namespace: home-assistant
        selector: app.kubernetes.io/name=home-assistant
        container: home-assistant
        tail: 100
  # OpenCloud and Collabora call each other server-side using the public
  # *.test.local names, so these must resolve inside the cluster. Pods do not
  # see the host's /etc/hosts, so point test.local at the private gateway in
  # CoreDNS.
  - try:
    - script:
        timeout: 3m
        content: |
          echo "=== Making *.test.local resolvable in the cluster ==="
          GATEWAY_IP=$(cat /tmp/envoy-private-ip)
          COREFILE=$(kubectl -n kube-system get configmap coredns -o jsonpath='{.data.Corefile}')
          if echo "${COREFILE}" | grep -q '^test.local:53'; then
            echo "CoreDNS already configured"
          else
            NEW_COREFILE=$(printf '%s\ntest.local:53 {\n    errors\n    hosts {\n        %s argocd.test.local opencloud.test.local jellyfin.test.local home-assistant.test.local keycloak.test.local agent.test.local collabora.test.local\n    }\n    cache 30\n}\n' "${COREFILE}" "${GATEWAY_IP}")
            kubectl -n kube-system patch configmap coredns --type merge -p "$(jq -n --arg corefile "${NEW_COREFILE}" '{data: {Corefile: $corefile}}')"
            kubectl -n kube-system rollout restart deployment coredns
          fi
          kubectl -n kube-system rollout status deployment coredns --timeout=2m
    catch:
    - script:
        timeout: 30s
        content: kubectl -n kube-system get configmap coredns -o yaml
    - podLogs:
        namespace: kube-system
        selector: k8s-app=kube-dns
        tail: 50
  # Verify Collabora Online discovery endpoint is accessible through the
  # gateway using the in-cluster DNS (no curl --resolve), the same path
  # OpenCloud uses when it fetches the discovery document.
  - try:
    - script:
        timeout: 2m
        content: |
          echo "=== Testing Collabora Online Discovery Endpoint ==="
          POD=collabora-discovery-check-$$
          # The route may need a moment to be programmed, so retry inside the pod.
          kubectl run "${POD}" -n opencloud --restart=Never --image=curlimages/curl:8.11.1 --command -- sh -c '
            for i in $(seq 20); do
              code=$(curl -sk --max-time 10 -o /dev/null -w "%{http_code}" https://collabora.test.local/hosting/discovery)
              [ "${code}" = "200" ] && break
              sleep 3
            done
            echo "${code}"'
          kubectl wait -n opencloud --for=jsonpath='{.status.phase}'=Succeeded "pod/${POD}" --timeout=90s
          HTTP_CODE=$(kubectl logs -n opencloud "${POD}")
          kubectl delete pod -n opencloud "${POD}" --ignore-not-found
          echo "HTTP Code: ${HTTP_CODE}"
          if [ "${HTTP_CODE}" != "200" ]; then
            echo "Expected 200 OK, got ${HTTP_CODE}"
            exit 1
          fi
          echo "Collabora Online discovery endpoint OK"
    catch:
    - describe:
        apiVersion: v1
        kind: Pod
        namespace: collabora
        selector: app.kubernetes.io/name=collabora
    - podLogs:
        namespace: collabora
        selector: app.kubernetes.io/name=collabora
        tail: 50
  # Verify OpenCloud's WOPI endpoint (called by Collabora) is reachable by name
  # from inside the cluster. The WOPI endpoint requires an access token, so any
  # HTTP response (not a DNS/connection failure) shows the name resolves and
  # routes.
  - try:
    - script:
        timeout: 60s
        content: |
          echo "=== Testing in-cluster access to the OpenCloud WOPI endpoint ==="
          POD=wopi-check-$$
          kubectl run "${POD}" -n opencloud --restart=Never --image=curlimages/curl:8.11.1 --command -- \
            curl -sk --max-time 10 -o /dev/null -w "%{http_code}" https://opencloud.test.local/wopi/files/does-not-exist
          kubectl wait -n opencloud --for=jsonpath='{.status.phase}'=Succeeded "pod/${POD}" --timeout=30s
          HTTP_CODE=$(kubectl logs -n opencloud "${POD}")
          kubectl delete pod -n opencloud "${POD}" --ignore-not-found
          echo "HTTP Code: ${HTTP_CODE}"
          if [ "${HTTP_CODE}" = "000" ] || [ -z "${HTTP_CODE}" ]; then
            echo "opencloud.test.local is not reachable from inside the cluster"
            exit 1
          fi
          echo "OpenCloud reachable by name from inside the cluster"
    catch:
    - describe:
        apiVersion: v1
        kind: Pod
        namespace: opencloud
        selector: app.kubernetes.io/name=opencloud
    - podLogs:
        namespace: opencloud
        selector: app.kubernetes.io/name=opencloud
        tail: 50
  # Verify OpenCloud has the Collabora (WOPI) integration configured
  - try:
    - script:
        timeout: 30s
        content: |
          echo "=== Verifying OpenCloud Collabora Configuration ==="
          # The ConfigMap name carries a content hash, look it up via the deployment
          CM=$(kubectl get deployment opencloud -n opencloud -o jsonpath='{.spec.template.spec.containers[0].envFrom[0].configMapRef.name}')
          check() {
            actual=$(kubectl get configmap "${CM}" -n opencloud -o jsonpath="{.data.$1}")
            if [ "${actual}" != "$2" ]; then
              echo "$1: expected '$2', got '${actual}'"
              exit 1
            fi
            echo "$1=${actual}"
          }
          check OC_ADD_RUN_SERVICES collaboration
          check FRONTEND_APP_HANDLER_SECURE_VIEW_APP_ADDR eu.opencloud.api.collaboration
          check COLLABORATION_WOPI_SRC https://opencloud.test.local
          check COLLABORATION_APP_ADDR https://collabora.test.local
    catch:
    - script:
        timeout: 30s
        content: |
          echo "=== OpenCloud ConfigMaps ==="
          kubectl get configmap -n opencloud -o yaml
          echo "=== OpenCloud Deployment ==="
          kubectl get deployment opencloud -n opencloud -o yaml

# Only Open WebUI may talk to the sandbox.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: open-terminal-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: open-terminal
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: open-webui
    ports:
    - port: 8000

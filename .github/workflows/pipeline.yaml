name: Pipeline

on:
  pull_request:
    branches:
    - main

jobs:
  kustomize-build:
    uses: ./.github/workflows/kustomize-reusable.yaml
    with:
      paths: >
        apps/kind argocd/overlays/kind cert-manager/overlays/kind cloudnative-pg/overlays/kind ddclient/overlays/kind external-secrets/overlays/kind hetzner-cloud-webhook/overlays/kind keycloak-operator/overlays/kind keycloak/overlays/kind jellyfin/overlays/kind metallb/overlays/kind pi-hole/overlays/kind wireguard/overlays/kind opencloud/overlays/kind
  kind-deploy:
    needs: kustomize-build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Install Chainsaw
      uses: kyverno/action-install-chainsaw@v0.2.15
    - name: Create Kind Cluster
      uses: helm/kind-action@v1.15.1
      with:
        config: kind-config.yaml

    - name: Preload redis image
      # Pull the redis image with retries and load it into the kind cluster, so
      # that the test doesn't depend on registry rate limits while ArgoCD starts.
      # The image reference comes from the kustomize overlay (mirror.gcr.io).
      run: |
        image=$(kustomize build argocd/overlays/kind | grep -oE 'image: \S*redis\S*' | cut -d' ' -f2 | sort -u)
        echo "Preloading $image"
        for i in 1 2 3 4 5; do
          docker pull "$image" && break
          if [ "$i" -eq 5 ]; then
            echo "Failed to pull $image"
            exit 1
          fi
          echo "Pull failed (attempt $i), retrying"
          sleep $((i * 20))
        done
        kind load docker-image "$image" --name chart-testing

    - name: Chainsaw test
      run: chainsaw test
      env:
        BITWARDEN_ACCESS_TOKEN: ${{ secrets.BITWARDEN_ACCESS_TOKEN }}
        TARGET_REVISION: ${{ github.head_ref }}

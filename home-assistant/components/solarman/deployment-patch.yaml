apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
spec:
  template:
    spec:
      initContainers:
      - name: install-solarman
        # Install the davidrapan/ha-solarman custom integration (Solis and
        # other inverters behind a Solarman V5 Wi-Fi logger, or a Modbus TCP
        # gateway) into the persistent /config volume. The release zip
        # contains the integration files at its root.
        image: docker.io/library/alpine:3.21
        command:
        - sh
        - -c
        - |
          set -ex
          VERSION="v26.01.31"
          DIR=/config/custom_components/solarman
          if [ "$(cat ${DIR}/.version 2>/dev/null)" != "${VERSION}" ]; then
            apk add --no-cache curl unzip
            curl -fL --retry 3 --retry-delay 5 -o /tmp/solarman.zip \
              "https://github.com/davidrapan/ha-solarman/releases/download/${VERSION}/solarman.zip"
            rm -rf /tmp/solarman
            mkdir -p /tmp/solarman
            unzip -o /tmp/solarman.zip -d /tmp/solarman
            # Keep user supplied inverter definitions across upgrades.
            if [ -d "${DIR}/inverter_definitions/custom" ]; then
              mkdir -p /tmp/solarman/inverter_definitions
              rm -rf /tmp/solarman/inverter_definitions/custom
              cp -a "${DIR}/inverter_definitions/custom" /tmp/solarman/inverter_definitions/custom
            fi
            rm -rf "${DIR}"
            mkdir -p "${DIR}"
            cp -a /tmp/solarman/. "${DIR}/"
            echo "${VERSION}" > "${DIR}/.version"
          fi
        volumeMounts:
        - name: config
          mountPath: /config

apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
spec:
  template:
    spec:
      initContainers:
      - name: install-goe-charger
        # Install the marq24/ha-goecharger-api2 custom integration (go-eCharger
        # and go-eController, APIv2) into the persistent /config volume. The
        # release zip contains the integration files at its root. Bump the
        # version to upgrade.
        image: docker.io/library/alpine:3.21
        command:
        - sh
        - -c
        - |
          set -ex
          VERSION="2026.11.2"
          DIR=/config/custom_components/goecharger_api2
          if [ "$(cat ${DIR}/.version 2>/dev/null)" != "${VERSION}" ]; then
            apk add --no-cache curl unzip
            curl -fL --retry 3 --retry-delay 5 -o /tmp/goe.zip \
              "https://github.com/marq24/ha-goecharger-api2/releases/download/${VERSION}/goecharger_api2.zip"
            rm -rf "${DIR}"
            mkdir -p "${DIR}"
            unzip -o /tmp/goe.zip -d "${DIR}"
            echo "${VERSION}" > "${DIR}/.version"
          fi
        volumeMounts:
        - name: config
          mountPath: /config

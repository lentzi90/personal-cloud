apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
spec:
  template:
    spec:
      containers:
      - name: home-assistant
        volumeMounts:
        - name: oidc-config
          mountPath: /config/packages/auth_oidc.yaml
          subPath: auth_oidc.yaml
          readOnly: true
      volumes:
      - name: oidc-config
        configMap:
          name: home-assistant-oidc-config

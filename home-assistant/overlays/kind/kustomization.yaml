apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: home-assistant

labels:
- includeSelectors: true
  pairs:
    environment: kind

resources:
- ../../base
- namespace.yaml
- httproute.yaml

components:
- ../../components/keycloak-sso


configMapGenerator:
- name: home-assistant-oidc-config
  files:
  - auth_oidc.yaml

# Hard coded test values, only for KinD. The generated ConfigMaps and Secret
# keep their name suffix hash so that config changes roll the Deployment.
secretGenerator:
- name: home-assistant-secrets
  files:
  - secrets.yaml

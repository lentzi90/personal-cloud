# Managed through GitOps; mounted read-only over the /config volume.
default_config:

homeassistant:
  name: Home
  latitude: !secret latitude
  longitude: !secret longitude
  elevation: !secret elevation
  time_zone: Europe/Helsinki
  # Environment specific integrations (e.g. SSO) are added as packages.
  packages: !include_dir_named packages

# The HTTP integration (reverse proxy trust for the Envoy gateway) is not
# configured here: since Home Assistant 2026.8 it is managed in the UI and
# stored in /config/.storage/http. See http-seed.json and the README.

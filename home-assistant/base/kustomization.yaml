apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: home-assistant

labels:
- includeSelectors: true
  pairs:
    app.kubernetes.io/name: home-assistant

resources:
- deployment.yaml
- service.yaml
- pvc.yaml

# The overlays must provide the Secret home-assistant-secrets with a
# secrets.yaml key (latitude, longitude, elevation).
configMapGenerator:
- name: home-assistant-configuration
  files:
  - configuration.yaml

images:
- name: ghcr.io/home-assistant/home-assistant
  newTag: 2026.10.4

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: keycloak
labels:
- pairs:
    environment: kind
resources:
- ../../base
- httproute.yaml

components:
- ../../components/homelab-realm

patches:
- target:
    kind: Keycloak
    name: keycloak
  patch: |-
    - op: add
      path: /spec/http/httpEnabled
      value: true
    - op: remove
      path: /spec/http/tlsSecret
# Configure OpenCloud web client (index 2) redirect URIs for KinD environment
- target:
    kind: KeycloakRealmImport
    name: homelab-realm
  patch: |-
    - op: add
      path: /spec/realm/clients/2/redirectUris
      value:
        - https://opencloud.local/*
    - op: add
      path: /spec/realm/clients/2/webOrigins
      value:
        - https://opencloud.local
    - op: add
      path: /spec/realm/clients/2/attributes/post.logout.redirect.uris
      value: https://opencloud.local/*
# Configure Jellyfin client (index 7) redirect URIs for KinD environment
- target:
    kind: KeycloakRealmImport
    name: homelab-realm
  patch: |-
    - op: add
      path: /spec/realm/clients/7/redirectUris
      value:
        - https://jellyfin.local/sso/OID/redirect/Keycloak
    - op: add
      path: /spec/realm/clients/7/webOrigins
      value:
        - https://jellyfin.local
    - op: add
      path: /spec/realm/clients/7/baseUrl
      value: https://jellyfin.local
# Test user for the KinD environment. The username matches the OpenCloud admin
# account created by IDM_ADMIN_PASSWORD, so signing in resolves to that account.
- target:
    kind: KeycloakRealmImport
    name: homelab-realm
  patch: |-
    - op: add
      path: /spec/realm/users
      value:
        - username: admin
          enabled: true
          emailVerified: true
          firstName: Admin
          lastName: User
          email: admin@opencloud.local
          credentials:
            - type: password
              value: admin
              temporary: false
          realmRoles:
            - opencloudAdmin
            - jellyfinAdmin
            - default-roles-homelab
          groups:
            - admins

##
## Example configuration for the Hetzner DNS API.
##
## This file is just a template/example. It is intentionally *not* wired up
## as a resource in kustomization.yaml. Each overlay is expected to provide
## the real ddclient-config secret, either by:
##  - Generating it from a real ddclient.conf with a secretGenerator (see
##    kustomization.yaml), useful for throwaway/test environments, or
##  - Rendering it from an ExternalSecret `target.template`, so the API
##    token can be pulled from a secret store instead of being committed to
##    git. See turing-talos/apps/ddclient/externalsecret.yaml for a real
##    example.
##
## `usev4=webv4` tells ddclient how to discover the public IPv4 address
## (via ipify by default). Without it ddclient defaults to `use=ip`, which
## needs a static `ip=` value and otherwise fails with "ip=<undefined>".
##
## See also: https://ddclient.net (protocol=hetzner)
usev4=webv4
protocol=hetzner                          \
zone=example.com                          \
password=hetzner-dns-api-token            \
example.com

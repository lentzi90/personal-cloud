apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
- includeSelectors: true
  pairs:
    app.kubernetes.io/name: ddclient

resources:
- cronjob.yaml

## Provide the ddclient-config secret (a single `ddclient.conf` key) in your
## overlay. Two supported approaches:
##
## 1. A secretGenerator, using a real ddclient.conf (good for throwaway/test
##    environments where the config doesn't need to be kept secret):
# secretGenerator:
#   - name: ddclient-config
#     files:
#       - ddclient.conf
##
## 2. An ExternalSecret with a `target.template` that renders ddclient.conf,
##    pulling the API token from a secret store (see
##    turing-talos/apps/ddclient/externalsecret.yaml for a real example).
